[package]
name = "rustclip-studio"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "Local-first Rust video studio with a temporal causal graph"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
quick-xml = { version = "0.37", features = ["serialize"] }
csv = "1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true

# Tested workaround for empty objects in this toolchain's test builds.
[profile.test]
codegen-units = 1
incremental = false
